# harmony.toml — theory prior on chord transitions for the 2nd chord pass (spike 2 T26, harmony.py).
#
# source: the user's knowledge note 「和声法ノート v3（band-sheets 音声解析用）」
#         §1.3–1.4 (strength, degree notation, quality families),
#         §2.2–2.5 (diatonic chords, T・S・D, typical progressions, cadences), §3.1–3.5, §3.7 (secondary
#         dominants, II–V, tritone substitute, borrowing, passing diminished 7th, sus4 resolution),
#         §6.1 (tiers), §6.2 (transition classes), §6.3 (key-change boundary), §6.4 (row normalization).
# books:  なし（手元の文献なし。根拠は和声法ノート v3 の § のみ。一般的な和声・ポピュラー音楽理論を自分たちの言葉でまとめたもの）
# weights: T14, tuned on synthetic incl. private chart set; see docs (docs/audio-spike2-plan.md 実績 T14):
#          the [tier] values were kept (theory_prior 0-3 x three tier shapes all within 0.002 of the objective);
#          which move belongs to which tier is music theory — change it only after fixing the note, note §6.6).
# note v3 (user decision 2026-10-17): the [minor] in-key set is the natural minor + the harmonic-minor V / vii°;
#          melodic-minor / dorian chords (IV, ii, vi°, viiø) moved to [minor] borrowed (note §2.3, §6.5).
#
# Only CHANGING moves (i != j) get a bonus; staying is never touched (note §1.1). A move matching several
# rules takes the STRONGEST tier once (no sums, note §6.1). Anything not listed = base (0): never a ban.
# bonus = chords.theory_prior x key confidence x tier value (note §1.3); then each row is normalized so the
# total probability of changing chord is unchanged (note §6.4, harmony.py).
#
# A chord is "<degree> <families>": degree = semitones above the key's tonic (0-11); families joined by '+'
# are a family name of [family] or a single analyzer quality (maj min 7 maj7 min7 dim aug sus4 m7b5 dim7).
# aug is in no family: every move to / from aug stays base (note §6.2 note on aug; pending user check).

[tier]  # log bonus per tier (note §6.1 initial values; T14: kept, flat). base is 0 and is never negative.
strong = 1.0
medium = 0.6
weak = 0.3

[family]  # note §1.4 quality families
M = ["maj", "maj7"]        # major type
D = ["7", "maj"]           # dominant type (a plain triad V is read as maj)
m = ["min", "min7"]        # minor type
o = ["dim", "m7b5", "dim7"]  # diminished type
s = ["sus4"]

# Generic rules (defined in harmony.py; tier and source here). x = target chord, "diatonic" = [<mode>].diatonic.
[generic.secondary_dominant]  # D-type chord (not diatonic) a 5th above x -> x; x root diatonic, not I, not vii°
tier = "medium"               # target quality by root only (E7 -> A too); V/IV only as 7 (I is diatonic)
src = "§3.1, §6.2"
[generic.two_five]            # m / o type a 5th above y -> D-type y, y = root of a secondary dominant (V/x)
tier = "medium"
src = "§3.2, §6.2"
[generic.tritone_sub]         # D-type chord a semitone above x -> diatonic x (I included)
tier = "medium"
src = "§3.3, §6.2"
[generic.passing_dim]         # dim7 with a tone a semitone below x's root (dim / m7b5: root) -> diatonic x
tier = "medium"
src = "§3.5, §6.2"
[generic.sus4_resolution]     # sus4 -> same root M / D type
tier = "medium"
src = "§3.7, §6.2"
[generic.diatonic_other]      # diatonic -> diatonic, different root, not covered above (V -> IV, ii -> I ...)
tier = "weak"
src = "§2.4, §6.2"
[generic.into_technique]      # diatonic -> secondary dominant / tritone sub / borrowed / passing dim (C -> C7 too)
tier = "weak"
src = "§3, §6.2"
[generic.backdoor_two_five]   # m type a whole tone above x -> D-type a semitone above x (Dm7 -> Db7), x diatonic
tier = "weak"
src = "§3.3, §6.2"

[major]
diatonic = ["0 M", "2 m", "4 m", "5 M", "7 D+s", "9 m", "11 o"]  # note §2.2 (Vsus4 is D)
borrowed = ["5 m", "8 M", "10 D", "3 M", "2 o", "7 m", "1 M"]     # note §3.4 (iv bVI bVII bIII iiø v bII)
strong = [
  { from = ["7 D+s", "11 o"], to = ["0 M"], src = "§2.4, §2.5, §6.2 D -> T" },
  { from = ["5 M", "2 m"], to = ["7 D+s", "11 o"], src = "§2.4, §6.2 S -> D" },
  { from = ["0 M", "9 m", "4 m"], to = ["5 M", "2 m"], src = "§2.4, §6.2 T -> S" },
  { from = ["4 m"], to = ["9 m"], src = "§2.4, §6.2 root a 5th down" },
  { from = ["9 m"], to = ["2 m"], src = "§2.4, §6.2 root a 5th down" },
  { from = ["2 m"], to = ["7 D+s"], src = "§2.4, §6.2 root a 5th down" },
  { from = ["7 D+s"], to = ["0 M"], src = "§2.4, §6.2 root a 5th down" },
  { from = ["0 M"], to = ["5 M"], src = "§2.4, §6.2 root a 5th down" },
  { from = ["5 M"], to = ["11 o"], src = "§2.4, §6.2 root a 5th down" },
  { from = ["11 o"], to = ["4 m"], src = "§2.4, §6.2 root a 5th down" },
]
medium = [
  { from = ["7 D+s"], to = ["9 m", "4 m"], src = "§2.4, §2.5, §6.2 deceptive (V -> iii pending user check)" },
  { from = ["5 M"], to = ["0 M"], src = "§2.5, §6.2 plagal" },
  { from = ["5 M"], to = ["5 m"], src = "§3.4, §6.2 IV -> iv" },
  { from = ["5 m"], to = ["0 M", "7 D+s"], src = "§3.4, §6.2 iv -> I, iv -> V" },
  { from = ["8 M"], to = ["10 D", "7 D+s"], src = "§3.4, §6.2 bVI -> bVII, bVI -> V" },
  { from = ["10 D"], to = ["0 M"], src = "§3.4, §6.2 bVII -> I" },
  { from = ["2 o"], to = ["7 D+s"], src = "§3.4, §6.2 iiø -> V" },
  { from = ["3 M"], to = ["5 M"], src = "§3.4, §6.2 bIII -> IV" },
  { from = ["7 m"], to = ["0 7"], src = "§3.4, §6.2 v -> I7 (V/IV)" },
]
weak = [
  { from = ["8 M"], to = ["0 M"], src = "§3.4, §6.2 bVI -> I" },
  { from = ["1 M"], to = ["7 D+s", "0 M"], src = "§3.4, §6.2 bII -> V, bII -> I" },
]

[minor]  # note v3 §2.3: natural minor + the harmonic-minor V (D+s) and vii° (dim, dim7); melodic / dorian = borrowed
diatonic = ["0 m", "2 o", "3 M", "5 m", "7 m", "8 M", "10 D", "7 D+s", "11 dim+dim7"]
borrowed = ["5 D", "2 m", "9 dim+m7b5", "11 m7b5", "0 M", "1 M"]  # note §3.4: IV, ii, vi°, viiø (dorian / melodic), I (Picardy), bII (Neapolitan)
strong = [
  { from = ["7 D+s", "11 dim+dim7"], to = ["0 m"], src = "§2.4, §2.5, §6.2 D -> T" },
  { from = ["5 m", "2 o", "8 M"], to = ["7 D+s", "11 dim+dim7"], src = "§2.4, §6.2 S -> D" },
  { from = ["0 m", "3 M"], to = ["5 m", "2 o", "8 M"], src = "§2.4, §6.2 T -> S" },
  { from = ["0 m"], to = ["5 m"], src = "§2.4, §6.2 root a 5th down" },
  { from = ["5 m"], to = ["10 D"], src = "§2.4, §6.2 root a 5th down" },
  { from = ["10 D"], to = ["3 M"], src = "§2.4, §6.2 root a 5th down" },
  { from = ["3 M"], to = ["8 M"], src = "§2.4, §6.2 root a 5th down" },
  { from = ["8 M"], to = ["2 o"], src = "§2.4, §6.2 root a 5th down" },
  { from = ["2 o"], to = ["7 D+s"], src = "§2.4, §6.2 root a 5th down" },
  { from = ["7 D+s"], to = ["0 m"], src = "§2.4, §6.2 root a 5th down" },
]
