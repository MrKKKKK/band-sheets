  { from = ["7 D+s"], to = ["8 M"], src = "§2.5, §6.2 deceptive" },
  { from = ["10 D", "7 m", "5 m"], to = ["0 m"], src = "§2.3, §6.2 subtonic / weak D / plagal -> i" },
  { from = ["8 M"], to = ["10 D"], src = "§2.3, §6.2 bVI -> bVII" },
  { from = ["5 D"], to = ["0 m"], src = "§3.4, §6.2 IV -> i" },
  { from = ["7 D+s", "11 dim+dim7"], to = ["0 M"], src = "§3.4, §6.2 -> I (Picardy third, from D)" },
]
