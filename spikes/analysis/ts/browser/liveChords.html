<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- CSP (a meta tag covers this page only, not the Worker's own requests; the no-network rule for the Worker is a test, liveNoNetwork.test.ts).
         script-src blob: = the capture worklet is loaded from a Blob URL (addModule follows script-src); worker-src 'self' = the analysis Worker's script file;
         style-src 'unsafe-inline' = the <style> block below; connect-src 'self' = this origin only (the dev server runs with hmr: false, so no WebSocket) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' blob:; worker-src 'self'; connect-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:"
    />
    <title>ライブ和音チェック</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1b1b1b;
        --muted: #5c5c5c;
        --line: #d6d6d6;
        --accent: #1f5fbf;
        --warn: #8a4b00;
        --warn-bg: #fff4e0;
        --bar: #7aa6e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161616;
          --fg: #ececec;
          --muted: #a8a8a8;
          --line: #3a3a3a;
          --accent: #7fb0ff;
          --warn: #ffcf8a;
          --warn-bg: #2d2314;
          --bar: #3d6bb3;
        }
      }
      body { background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, sans-serif; margin: 0; padding: 16px; max-width: 760px; }
      h1 { font-size: 1.2rem; margin: 0 0 8px; }
      .warn { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 12px; margin: 0 0 12px; font-size: 0.9rem; }
      .warn p { margin: 0; }
      .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 8px 0; }
      select, button { font: inherit; }
      .meter { width: 160px; height: 12px; background: var(--line); border-radius: 3px; position: relative; overflow: hidden; }
      .meter > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); width: 0; }
      .meter > b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); left: 0; }
      .box { border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; margin: 12px 0; }
      #answer { font-size: 2.6rem; font-weight: 600; text-align: center; min-height: 3.6rem; line-height: 1.3; }
      #msg { text-align: center; color: var(--muted); min-height: 1.5em; }
      table { border-collapse: collapse; width: 100%; }
      td { padding: 2px 8px 2px 0; white-space: nowrap; }
      td.bar { width: 100%; }
      td.bar i { display: block; height: 10px; background: var(--bar); border-radius: 2px; }
      tr.cut td { color: var(--muted); font-size: 0.85rem; border-top: 1px dashed var(--line); }
      .num { text-align: right; font-variant-numeric: tabular-nums; }
      .muted { color: var(--muted); font-size: 0.85rem; }
      .stats { font-variant-numeric: tabular-nums; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>ライブ和音チェック（研究用・録音しない）</h1>
    <div class="warn">
      <p>ホールドアウトの曲（k〜n）は弾かない（録音でも手でも流さない）。</p>
      <p>a〜j の印象で次のスパイクの値を決めない。</p>
      <p>% はロジックをまたいで比べられない（v1a・base・s8-D2・s8-cand は同じ数、D2＋D1 と D1 だけは同じ数、違うのは s7-V1）。</p>
      <p>拍・前後のつながりは使っていない（スパイクの数字とは別物）。</p>
    </div>

    <div class="row">
      <label>入力 <select id="device"><option value="">（既定の入力）</option></select></label>
      <span class="meter" title="入力の大きさ（RMS の帯、細い線がピーク）"><i id="meterRms"></i><b id="meterPeak"></b></span>
      <span id="meterText" class="stats">— dBFS</span>
      <button id="start">開始</button>
      <button id="recal" disabled>測り直す</button>
    </div>
    <div class="row">
      <label>ロジック <select id="variant"></select></label>
      <label>調（表記だけ） <select id="key"></select></label>
    </div>
    <div class="row">
      <label>窓 <input id="win" type="range" min="0.5" max="3" step="0.1" value="1" /> <span id="winText">1.0 秒</span></label>
    </div>
    <div id="variantNote" class="muted"></div>

    <div class="box">
      <div id="answer">—</div>
      <div id="msg">「開始」を押してください。</div>
      <table><tbody id="cands"></tbody></table>
      <div id="extra" class="muted"></div>
      <div class="muted">% は相対の強さ。アプリの確からしさとは別物</div>
    </div>

    <div class="box stats" id="stats">計算 — ms ・ — 回/秒 ・ — 秒前の音 ・ 調律 — ・ 利得 — ・ 開始後の抜け 0 ms</div>
    <script type="module" src="./liveChordsPage.ts"></script>
  </body>
</html>
