<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Format spike</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; width: 1100px; }
      section { border-top: 2px solid #888; padding: 8px 0 24px; }
      pre { background: #f4f4f4; padding: 8px; font-size: 12px; white-space: pre-wrap; }
      .chart .line { font-family: monospace; white-space: pre; font-size: 18px; line-height: 1.2; margin-bottom: 8px; }
      .chart .chord { color: #b00; font-weight: bold; }
      .error { color: #b00; font-weight: bold; }
    </style>
  </head>
  <body>
    <section id="a"><h2>A. alphaTex</h2><pre class="src"></pre><div class="out"></div></section>
    <section id="b"><h2>B. ABC (abcjs)</h2><pre class="src"></pre><div class="out"></div></section>
    <section id="c"><h2>C. ChordPro container + alphaTex blocks</h2><pre class="src"></pre><div class="chart"></div><div class="out"></div></section>
    <script type="module" src="./main.js"></script>
  </body>
</html>
