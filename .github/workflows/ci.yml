name: CI

on:
  pull_request:
  push:
    branches: [main, 'research/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npx prettier --check .
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build
      - name: Bundle check (no analysis code in the first load, Worker notices, size)
        run: npm run check-bundle

  # Audio analysis spike (spikes/analysis/py): outside lint/tsc/npm test, so run its Python tests here.
  # Separate job (not a step of `check`) so the required `check` stays fast and Node-only.
  spike-analysis-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: spikes/analysis/py/requirements.lock.txt
      - run: pip install -r spikes/analysis/py/requirements.lock.txt
      - name: Python tests
        working-directory: spikes/analysis
        run: python -m unittest discover -s py/tests
